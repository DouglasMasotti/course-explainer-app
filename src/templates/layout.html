<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Course Explainer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="logo">Course Explainer</a>
      <ul>
        <li><a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="nav-active"{% endif %}>Home</a></li>
        <li><a href="{{ url_for('contact') }}" {% if request.endpoint == 'contact' %}class="nav-active"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">© 2025 Course Explainer App</div>
  </footer>
</body>
</html>
